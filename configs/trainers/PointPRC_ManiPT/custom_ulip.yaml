DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 16
  NUM_WORKERS: 2

OPTIM:
  NAME: "adam"
  LR: 0.0025
  WEIGHT_DECAY: 5e-4
  ADAM_BETA1: 0.9
  ADAM_BETA2: 0.999
  MAX_EPOCH: 20
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 40

PointEncoder: {
  NAME: PointBert,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.1,
  cls_dim: 40,
  num_heads: 6,
  group_size: 32,
  num_group: 512,
  encoder_dims: 256,
  num_points: 1024,
}

TextEncoder: {
  embed_dim: 512,
  ctx_len: 77,
  vocab_size: 49408,
  trans_width: 512,
  trans_heads: 8,
  trans_layers: 12,
}

TRAINER:
  PointPRC_ManiPT:
    EVAL_ONLY: False
    N_CTX_POINT: 4
    N_CTX_TEXT: 5
    CTX_INIT: "a point cloud of a"
    PREC: "fp32"
    PROMPT_DEPTH_POINT: 9
    PROMPT_DEPTH_TEXT: 9
    PROMPT_TYPE: "manual64"
    NO_TDC: False
    LAMBDA_REG: 1.0
    TAU: 100.0
    D_PCA: 64

# ======== [NEW - ADD] everything from here down to the line "TEST_ROT_SEED" is NEW ========
    # ---------------- rotation extension (all defaults = original ManiPT, i.e. E0) ----------------
    ROT_MODE: "none"            # none | so2 | so3 | axis_angle   (train-time rotation, 2 views per sample)
    ROT_MAX_DEG: 180.0          # so2 / axis_angle only
    ROT_AXIS: "z"               # so2 only: rotation axis (x|y|z); z, same as the reference paper
    ROT_FIRST_IDENTITY: False   # True: view1 = original, view2 = rotated
    SCALE_MIN: 0.8              # random scaling per view, s ~ U[SCALE_MIN, SCALE_MAX]; 1.0/1.0 = off
    SCALE_MAX: 1.2              # reference paper: 0.8 / 1.2
    SCALE_MODE: "iso"            # iso | aniso
    SCALE_VOL_PRESERVE: False
    N_VIEWS: 2
    N_CLEAN_VIEWS: 1


    GAMMA_S: 0.0                # idea 1 weight (sensitive-subspace penalty)
    GAMMA_S_SCHEDULE: "const"   # const | linear_decay
    SUBSPACE_PATH: ""           # .pt from compute_rot_subspace.py
    SUBSPACE_MODE: "sens"       # sens (M=P_rot) | complement (M=I-P_rot) | soft (M=D*Sigma/trSigma)
    SUBSPACE_K: 0               # 0 -> choose k by SUBSPACE_ENERGY
    SUBSPACE_ENERGY: 0.9
 
    GAMMA_INV: 0.0              # idea 2 weight (invariance between the two views)
    INV_KIND: "h"               # h | f | kl
    INV_STOPGRAD: False
    ANCHOR_CLEAN: False

    
    
    TEST_ROT_MODE: "none"       # none | so2 | so3 | axis_angle  (rotate TEST split at evaluation)
    TEST_ROT_MAX_DEG: 180.0
    TEST_ROT_AXIS: "z"
    TEST_ROT_SEED: 2024
    
 


TEST:
  FINAL_MODEL: 'best_val'